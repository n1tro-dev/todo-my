
services:
  db:
    image: postgres:15-alpine
    container_name: todo_db_container
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
      
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
volumes:
  todo_pgdata:
